[project]
name = "mine-sarthi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vishalkumarjaiswal16", email = "vishaljaiswalk885@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # Web Framework & Server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    # MQTT Client
    "paho-mqtt>=1.6.1",
    # HTTP Client
    "requests>=2.28",
    # Database Clients
    "influxdb>=5.3.1",
    "psycopg2-binary>=2.9.6",
    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # ML / AI
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "scipy>=1.10.0",
    # Configuration & Utilities
    "python-dotenv>=1.0.0",
    "APScheduler>=3.10.0",
    "python-json-logger>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
